name: Deploy Dev Environment

on:
  push:
    branches: [ main ]
    paths:
      - 'infra/environments/dev/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Dev RG
      run: |
        az deployment sub create           --location eastus           --template-file infra/environments/dev/main.bicep           --parameters @infra/environments/dev/parameters.dev.json
